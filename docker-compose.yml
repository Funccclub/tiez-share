# TieZ Share - 局域网文件中转 / 聊天室
#
# iStoreOS 用法：
#   1. 先挂载 U 盘/硬盘，确认路径（下面假设挂到了 /mnt/sda1）
#   2. mkdir -p /mnt/sda1/tiez-share
#   3. 把这个文件放到路由器上，例如 /root/tiez-share/docker-compose.yml
#   4. cd /root/tiez-share && docker compose up -d
#
# GitHub Actions 自动构建并发布到 Docker Hub，自动匹配 ARM64 / x86_64。
# 也可以从 Actions 下载镜像包后导入，使用本地标签，
# 或者改用下面注释里的 build 段在路由器上直接编译。

services:
  tiez-share:
    image: 14854/tiez-share:latest
    # 想直接在路由器上编译镜像就改用下面两行（第一次会比较慢）：
    # build:
    #   context: .
    container_name: tiez-share
    restart: unless-stopped

    # Linux/iStoreOS：使用宿主机网段，保留客户端真实来源。
    network_mode: host

    environment:
      TIEZ_PORT: "12345"
      TIEZ_BIND: "::"
      TIEZ_DATA_DIR: "/data"
      # 界面标题（会显示在所有设备的页面上）
      TIEZ_TITLE: "家庭局域网中转"
      # sticky-note | paper | mica | acrylic
      TIEZ_THEME: "mica"
      # system | light | dark
      TIEZ_COLOR_MODE: "system"
      # 保留多少条聊天记录（每条都写盘，路由器 flash 小就别开太大）
      TIEZ_MAX_HISTORY: "1000"
      # 加入/离开提醒默认关闭
      TIEZ_JOIN_NOTICE: "0"
      # 空值自动检测直连网段；多网段时可明确填写，例如 192.168.8.0/24
      TIEZ_LAN_CIDRS: ""
      # 可指定稳定网卡名，网段仍自动跟随变化；空值自动选择活动 LAN 网卡
      TIEZ_LAN_INTERFACE: ""
      # 使用反向代理才填写；仅信任指定的 /32 或 /128 主机
      # 例如本机 Lucky: 127.0.0.1/32（代理须覆盖或追加真实 TCP 来源到 XFF 末尾）
      TIEZ_TRUSTED_PROXIES: ""
      TIEZ_MAX_FILE_BYTES: "2147483648"
      TIEZ_MAX_STORAGE_BYTES: "10737418240"
      TIEZ_FILE_TTL_SECS: "604800"
      TIEZ_UPLOAD_TTL_SECS: "3600"
      TIEZ_CLEANUP_INTERVAL_SECS: "60"

    volumes:
      # 一定要挂到外置盘：/data 里会堆积所有中转文件，
      # 写到 overlay 上有把路由器系统分区写满的风险。
      #
      # 另外别把「和别人共用的目录」直接挂进来：页面左侧的文件区会列出这个目录
      # 下的所有文件，并且允许删除其中任何一个。留一层子目录才安全，
      # 比如 /mnt/sda/disk/others/tiez 而不是 /mnt/sda/disk/others。
      - /mnt/sda1/tiez-share:/data

    labels:
      # 在 Dockge 中手动拉取和更新，关闭 watchtower 自动更新。
      com.centurylinklabs.watchtower.enable: "false"

    # 路由器性能弱，本想限一下内存，但 iStoreOS 内核没开 cgroup 内存限制，
    # 写了会被丢弃并打印 "Limitation discarded" 警告。普通 Docker 上可以打开：
    # deploy:
    #   resources:
    #     limits:
    #       memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
