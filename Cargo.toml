[package]
name = "tiez-share"
version = "0.1.0"
edition = "2021"
description = "TieZ Share - standalone LAN file transfer & chat relay extracted from jimuzhe/tiez-clipboard"
license = "GPL-3.0"
repository = "https://github.com/Funccclub/tiez-share"
default-run = "tiez-share"

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "fs",
    "io-util",
    "sync",
    "time",
    "signal",
] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
mime_guess = "2"
urlencoding = "2.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
